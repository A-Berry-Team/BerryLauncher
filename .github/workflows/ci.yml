name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap checks that need no native libraries.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Version consistency (meson.build, Cargo.toml, workspace, metainfo)
        run: |
          version=$(sed -n "s/.*version: '\([0-9][^']*\)'.*/\1/p" meson.build | head -n1)
          python3 build-aux/check-version.py "$version" Cargo.toml \
            data/app.berrylauncher.berry.metainfo.xml.in
      - name: Formatting
        run: |
          # src/config.rs is generated by meson; rustfmt only needs it to exist.
          printf 'pub static VERSION: &str = "0.0.0";\npub static PKGDATADIR: &str = "/usr/share";\n' > src/config.rs
          rustup component add rustfmt
          cargo fmt --all -- --check

  # Builds the whole workspace against the same stack the app uses (GTK 4, libadwaita,
  # WebKitGTK 6, dav1d, libwebp).
  build:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc gcc-c++ make perl-core pkgconf-pkg-config rust cargo clippy \
            gtk4-devel libadwaita-devel webkitgtk6.0-devel libwebp-devel 'pkgconfig(dav1d)' \
            openssl-devel xz-devel
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
      - name: Generate src/config.rs
        run: |
          printf 'pub static VERSION: &str = "0.0.0";\npub static PKGDATADIR: &str = "/usr/share";\n' > src/config.rs
      - name: Build
        run: cargo build --workspace --locked
      # Warnings are reported but do not fail the job yet; turn this into `-D warnings` once clean.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked
